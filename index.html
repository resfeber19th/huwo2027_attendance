<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUWO2027 出席登録</title>
  
  <!-- Noto Sans JP の読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 15px;
      background: #f4f6f8;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .main-content {
      flex: 1;
    }
    .app-header {
      text-align: center;
      padding: 10px 0 15px;
    }
    .app-header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1a73e8;
      margin: 0;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 15px;
    }
    .hidden {
      display: none !important;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 14px;
    }
    input, select, textarea, button {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: inherit;
    }
    button {
      background: #1a73e8;
      color: white;
      border: none;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
      transition: background 0.2s;
    }
    button:hover {
      background: #1557b0;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #5f6368;
      margin-top: 0;
    }
    .btn-secondary:hover {
      background: #474a4d;
    }
    .btn-warning {
      background: #f2994a;
      color: white;
    }
    .btn-warning:hover {
      background: #e0883b;
    }
    .concert-item {
      padding: 15px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
      background: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s, border-color 0.2s;
    }
    .concert-item:hover {
      background: #e8f0fe;
      border-color: #1a73e8;
    }
    .status-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .badge-success {
      background-color: #e6f4ea;
      color: #137333;
    }
    .badge-warning {
      background-color: #fef7e0;
      color: #b06000;
    }
    .badge-gray {
      background-color: #f1f3f4;
      color: #5f6368;
    }
    .piece-card {
      padding: 12px;
      border: 1px solid #eee;
      border-radius: 6px;
      background: #fafafa;
      margin-bottom: 12px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    .btn-group button {
      margin-top: 0;
    }
    .app-footer {
      text-align: center;
      padding: 20px 0 10px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>
<body>

  <div class="main-content">
    <!-- アプリヘッダー -->
    <div class="app-header">
      <h1>HUWO2027 出席登録</h1>
    </div>

    <!-- 1. ログイン画面 -->
    <div id="view-login" class="card">
      <h2 style="margin-top:0; font-weight:700; font-size:18px;">団員ログイン</h2>
      <div class="form-group">
        <label for="login-id">ユーザーID</label>
        <input type="text" id="login-id" placeholder="例: u001">
      </div>
      <div class="form-group">
        <label for="login-pass">パスワード</label>
        <input type="password" id="login-pass">
      </div>
      <button id="login-btn" onclick="login()">ログイン</button>
      <p id="login-msg" style="color:red; margin-top: 10px; text-align: center; font-size:14px;"></p>
    </div>

    <!-- 2. ホーム画面 -->
    <div id="view-home" class="hidden">
      <div class="header-bar">
        <h3 style="margin:0; font-weight:700;"><span id="user-name"></span> さん</h3>
        <button onclick="logout()" style="width: auto; padding: 6px 12px;" class="btn-secondary">ログアウト</button>
      </div>

      <!-- 優先度1: 演奏会・乗番設定カード -->
      <div class="card" style="border-left: 5px solid #34a853;">
        <h3 style="margin-top:0; font-weight:700; font-size:16px;">🎼 演奏会・乗番設定</h3>
        <p style="font-size:13px; color:#666;">最初に曲ごとの乗り番や担当パートを登録してください。</p>
        <div id="concert-list">読み込み中...</div>
      </div>

      <!-- 優先度2: 合奏出欠入力カード -->
      <div class="card" style="border-left: 5px solid #1a73e8;">
        <h3 style="margin-top:0; font-weight:700; font-size:16px;">📅 合奏出欠確認</h3>
        <p style="font-size:13px; color:#666;">練習日と対象曲（乗り番）を指定して出欠を入力します。</p>
        <button onclick="showAttendanceForm()">合奏出欠を入力する</button>
      </div>
    </div>

    <!-- 3. 乗番・パート設定画面 -->
    <div id="view-roster" class="card hidden">
      <button onclick="showHome()" class="btn-secondary" style="margin-bottom: 15px; width: auto; padding: 6px 12px;">← ホームへ戻る</button>
      <h3 id="roster-concert-title" style="margin-top:0; font-weight:700; font-size:16px;"></h3>
      <form id="roster-form">
        <div id="pieces-container"></div>
        <div class="btn-group">
          <button type="button" class="btn-warning" onclick="submitRoster('一時保存')">一時保存する</button>
          <button type="button" onclick="submitRoster('確定')">保存する（確定）</button>
        </div>
      </form>
    </div>

    <!-- 4. 合奏出欠入力画面 -->
    <div id="view-attendance" class="card hidden">
      <button onclick="showHome()" class="btn-secondary" style="margin-bottom: 15px; width: auto; padding: 6px 12px;">← ホームへ戻る</button>
      <h3 style="margin-top:0; font-weight:700; font-size:16px;">📅 合奏出欠入力</h3>
      
      <form id="attendance-form">
        <div class="form-group">
          <label for="att-date">練習日を選択</label>
          <input type="date" id="att-date" onchange="updateTargetPieces()" required>
        </div>

        <div class="form-group">
          <label for="att-target">対象曲・練習項目</label>
          <select id="att-target" required>
            <option value="">日付を選択してください</option>
          </select>
        </div>

        <div class="form-group">
          <label for="att-status">出欠</label>
          <select id="att-status" required>
            <option value="〇">〇</option>
            <option value="✕">✕</option>
            <option value="遅刻">遅刻</option>
            <option value="早退">早退</option>
          </select>
        </div>

        <div class="form-group">
          <label for="att-note">備考（遅刻早退の時間や理由など）</label>
          <textarea id="att-note" rows="3" placeholder="例: 19:30から遅れて参加予定です"></textarea>
        </div>

        <button type="submit" id="att-submit-btn">出欠を送信する</button>
      </form>
    </div>
  </div>

  <!-- フッター -->
  <footer class="app-footer">
    <span id="last-updated">最終更新: ---</span>
  </footer>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbw1vZx7jWQ1DT11u3oOJrVyhalJbFuteUDjL5E-gHl2O5OJfa4r08SKhbCWrrDugnnV/exec";

    const PART_OPTIONS = {
      "Clarinet": ["1st Cl", "2nd Cl", "3rd Cl", "Es Cl", "Alto Cl", "Bass Cl", "ContraBass Cl", "不参加", "その他（直接入力）"],
      "Trumpet": ["1st Tp", "2nd Tp", "3rd Tp", "Flugelhorn", "Cornet", "不参加", "その他（直接入力）"],
      "Saxophone": ["Alto 1st", "Alto 2nd", "Tenor", "Baritone", "Soprano", "不参加", "その他（直接入力）"],
      "Flute": ["1st Fl", "2nd Fl", "Piccolo", "不参加", "その他（直接入力）"],
      "Percussion": ["Timpani", "Snare", "Mallets", "Aux", "不参加", "その他（直接入力）"],
      "Euphonium": ["1st", "2nd", "Solo", "アシスト", "不参加", "その他（直接入力）"],
      "Trombone": ["1st", "2nd", "3rd", "Bass Trb", "不参加", "その他（直接入力）"],
      "Horn": ["1st", "2nd", "3rd", "4th", "不参加", "その他（直接入力）"],
      "Tuba": ["1st", "2nd", "不参加", "その他（直接入力）"]
    };

    let currentUser = null;
    let currentConcerts = [];
    let currentSchedules = {};
    let selectedConcertId = null;

    window.onload = () => {
      displayLastModified();

      const savedUser = localStorage.getItem("band_user");
      if (savedUser) {
        try {
          currentUser = JSON.parse(savedUser);
          if (currentUser && currentUser.userId) {
            showHome();
          } else {
            logout();
          }
        } catch (e) {
          logout();
        }
      }
    };

    function displayLastModified() {
      try {
        const lastMod = new Date(document.lastModified);
        if (!isNaN(lastMod.getTime())) {
          const year = lastMod.getFullYear();
          const month = String(lastMod.getMonth() + 1).padStart(2, '0');
          const day = String(lastMod.getDate()).padStart(2, '0');
          const hours = String(lastMod.getHours()).padStart(2, '0');
          const minutes = String(lastMod.getMinutes()).padStart(2, '0');
          document.getElementById("last-updated").textContent = `最終更新: ${year}/${month}/${day} ${hours}:${minutes}`;
        }
      } catch (e) {
        console.warn("Date parse error", e);
      }
    }

    function switchView(viewId) {
      ["view-login", "view-home", "view-roster", "view-attendance"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.add("hidden");
      });
      const target = document.getElementById(viewId);
      if (target) target.classList.remove("hidden");
    }

    async function login() {
      const userIdEl = document.getElementById("login-id");
      const passwordEl = document.getElementById("login-pass");
      const msg = document.getElementById("login-msg");
      const btn = document.getElementById("login-btn");

      const userId = userIdEl ? userIdEl.value.trim() : "";
      const password = passwordEl ? passwordEl.value.trim() : "";

      if (!userId || !password) {
        if (msg) msg.textContent = "IDとパスワードを入力してください。";
        return;
      }

      if (btn) btn.disabled = true;
      if (msg) msg.textContent = "通信中...";

      const res = await apiCall({ action: "login", userId, password });
      if (btn) btn.disabled = false;

      if (res && res.result === "success" && res.user) {
        if (msg) msg.textContent = "";
        currentUser = res.user;
        localStorage.setItem("band_user", JSON.stringify(currentUser));
        showHome();
      } else {
        if (msg) msg.textContent = res ? res.message : "ログイン処理に失敗しました。";
      }
    }

    function logout() {
      localStorage.removeItem("band_user");
      currentUser = null;
      const u = document.getElementById("login-id");
      const p = document.getElementById("login-pass");
      if (u) u.value = "";
      if (p) p.value = "";
      switchView("view-login");
    }

    async function showHome() {
      switchView("view-home");
      const uNameEl = document.getElementById("user-name");
      if (uNameEl && currentUser) uNameEl.textContent = currentUser.name || "";
      
      const container = document.getElementById("concert-list");
      if (!container) return;
      container.innerHTML = "読み込み中...";

      const res = await apiCall({ action: "getConcerts", userId: currentUser ? currentUser.userId : "" });
      if (res && res.result === "success") {
        currentConcerts = Array.isArray(res.concerts) ? res.concerts : [];
        currentSchedules = res.schedules || {};
        container.innerHTML = "";

        if (currentConcerts.length === 0) {
          container.innerHTML = "<p style='color:#666;'>予定されている演奏会はありません。</p>";
          return;
        }

        currentConcerts.forEach(c => {
          if (!c) return;
          const div = document.createElement("div");
          div.className = "concert-item";
          
          let badgeHtml = "";
          if (c.status === "確定") {
            badgeHtml = `<span class="status-badge badge-success">完了</span>`;
          } else if (c.status === "一時保存") {
            badgeHtml = `<span class="status-badge badge-warning">一時保存中</span>`;
          } else {
            badgeHtml = `<span class="status-badge badge-gray">未登録</span>`;
          }

          div.innerHTML = `
            <div>
              <strong>${c.title || "演奏会"}</strong><br>
              <small style="color:#666;">タップして乗番・パートを設定</small>
            </div>
            ${badgeHtml}
          `;
          div.onclick = () => showRosterForm(c.concertId);
          container.appendChild(div);
        });
      }
    }

    function showRosterForm(concertId) {
      selectedConcertId = concertId;
      const concert = currentConcerts.find(c => c && c.concertId === concertId);
      if (!concert) return;

      const titleEl = document.getElementById("roster-concert-title");
      if (titleEl) titleEl.textContent = concert.title || "";
      
      const container = document.getElementById("pieces-container");
      if (!container) return;
      container.innerHTML = "";

      const userPart = (currentUser && currentUser.defaultPart) ? currentUser.defaultPart : "";
      const options = PART_OPTIONS[userPart] || ["1st", "2nd", "3rd", "アシスト", "不参加", "その他（直接入力）"];
      const userRoster = concert.userRoster || {};

      const pieces = Array.isArray(concert.pieces) ? concert.pieces : [];
      pieces.forEach((piece, index) => {
        const savedPart = userRoster[piece] || "";
        const isCustom = savedPart && !options.includes(savedPart);

        const card = document.createElement("div");
        card.className = "piece-card";
        card.innerHTML = `
          <div style="font-weight:bold; margin-bottom:8px;">${piece}</div>
          <div style="display: flex; gap: 8px; flex-direction: column;">
            <select id="select-part-${index}" onchange="toggleCustomInput(${index})">
              <option value="">-- パートを選択 --</option>
              ${options.map(opt => `<option value="${opt}" ${savedPart === opt ? 'selected' : ''}>${opt}</option>`).join('')}
            </select>
            <input type="text" id="custom-part-${index}" placeholder="例: 1st (Es Cl持ち替え)" 
                   value="${isCustom ? savedPart : ''}" 
                   style="display: ${isCustom ? 'block' : 'none'}; margin-top:5px;">
          </div>
        `;
        container.appendChild(card);

        if (isCustom) {
          const sel = document.getElementById(`select-part-${index}`);
          if (sel) sel.value = "その他（直接入力）";
        }
      });

      switchView("view-roster");
    }

    function toggleCustomInput(index) {
      const select = document.getElementById(`select-part-${index}`);
      const customInput = document.getElementById(`custom-part-${index}`);
      if (!select || !customInput) return;

      if (select.value === "その他（直接入力）") {
        customInput.style.display = "block";
        customInput.required = true;
      } else {
        customInput.style.display = "none";
        customInput.required = false;
      }
    }

    async function submitRoster(saveStatus) {
      const concert = currentConcerts.find(c => c && c.concertId === selectedConcertId);
      if (!concert) return;

      const roster = {};
      const pieces = Array.isArray(concert.pieces) ? concert.pieces : [];

      pieces.forEach((piece, index) => {
        const select = document.getElementById(`select-part-${index}`);
        const customInput = document.getElementById(`custom-part-${index}`);
        if (!select) return;
        
        let finalPart = select.value;
        if (finalPart === "その他（直接入力）" && customInput) {
          finalPart = customInput.value.trim();
        }

        if (finalPart) {
          roster[piece] = finalPart;
        }
      });

      const res = await apiCall({
        action: "saveRoster",
        userId: currentUser ? currentUser.userId : "",
        concertId: selectedConcertId,
        roster: roster,
        status: saveStatus
      });

      if (res && res.result === "success") {
        const msgStr = saveStatus === "確定" ? "乗番情報を保存（完了）しました！" : "乗番情報を一時保存しました！";
        alert(msgStr);
        showHome();
      }
    }

    function showAttendanceForm() {
      switchView("view-attendance");
      const dateEl = document.getElementById("att-date");
      if (dateEl) {
        const today = new Date().toISOString().split('T')[0];
        dateEl.value = today;
      }
      updateTargetPieces();
    }

    function updateTargetPieces() {
      const dateEl = document.getElementById("att-date");
      const targetSelect = document.getElementById("att-target");
      if (!targetSelect) return;
      targetSelect.innerHTML = "";

      const dateVal = dateEl ? dateEl.value : "";
      if (!dateVal) {
        targetSelect.innerHTML = "<option value=''>日付を選択してください</option>";
        return;
      }

      const d = new Date(dateVal + "T00:00:00");
      const days = ["日", "月", "火", "水", "木", "金", "土"];
      const formattedDateStr = `${d.getMonth() + 1}/${d.getDate()}(${days[d.getDay()]})`;

      const scheduledItems = (currentSchedules && Array.isArray(currentSchedules[dateVal])) ? currentSchedules[dateVal] : [];
      const userDefaultPart = (currentUser && currentUser.defaultPart) ? currentUser.defaultPart : "";

      if (scheduledItems.length > 0) {
        scheduledItems.forEach(item => {
          if (!item) return;
          const pieceName = item.piece || "";
          const timeStr = item.time ? ` ${item.time}` : "";

          if (pieceName === "基礎合奏") {
            const opt = document.createElement("option");
            const valStr = `${formattedDateStr}${timeStr} 基礎合奏`;
            opt.value = valStr;
            opt.textContent = valStr;
            opt.setAttribute("data-part", userDefaultPart);
            targetSelect.appendChild(opt);
          } else {
            let userPartForPiece = userDefaultPart;
            currentConcerts.forEach(c => {
              if (c && c.userRoster && c.userRoster[pieceName]) {
                userPartForPiece = c.userRoster[pieceName];
              }
            });

            if (userPartForPiece !== "不参加") {
              const opt = document.createElement("option");
              const valStr = `${formattedDateStr}${timeStr} ${pieceName}`;
              opt.value = valStr;
              opt.textContent = `${valStr} [担当: ${userPartForPiece}]`;
              opt.setAttribute("data-part", userPartForPiece);
              targetSelect.appendChild(opt);
            }
          }
        });
      } else {
        const defaultOpt = document.createElement("option");
        defaultOpt.value = `${formattedDateStr} 基礎合奏`;
        defaultOpt.textContent = `${formattedDateStr} 基礎合奏`;
        defaultOpt.setAttribute("data-part", userDefaultPart);
        targetSelect.appendChild(defaultOpt);

        let myPieces = [];
        currentConcerts.forEach(c => {
          if (c && c.userRoster) {
            Object.keys(c.userRoster).forEach(piece => {
              const part = c.userRoster[piece];
              if (part && part !== "不参加") {
                myPieces.push({ concertTitle: c.title, piece, part });
              }
            });
          }
        });

        myPieces.forEach(p => {
          const opt = document.createElement("option");
          const valStr = `${formattedDateStr} ${p.piece}`;
          opt.value = valStr;
          opt.textContent = `${valStr} [担当: ${p.part}]`;
          opt.setAttribute("data-part", p.part);
          targetSelect.appendChild(opt);
        });
      }
    }

    const attForm = document.getElementById("attendance-form");
    if (attForm) {
      attForm.onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById("att-submit-btn");
        if (btn) {
          btn.disabled = true;
          btn.textContent = "送信中...";
        }

        const targetSelect = document.getElementById("att-target");
        const selectedOption = targetSelect ? targetSelect.options[targetSelect.selectedIndex] : null;
        const detailPart = selectedOption ? (selectedOption.getAttribute("data-part") || "") : "";

        const dateEl = document.getElementById("att-date");
        const statusEl = document.getElementById("att-status");
        const noteEl = document.getElementById("att-note");

        const res = await apiCall({
          action: "saveAttendance",
          userId: currentUser ? currentUser.userId : "",
          name: currentUser ? currentUser.name : "",
          date: dateEl ? dateEl.value : "",
          targetPiece: targetSelect ? targetSelect.value : "",
          detailPart: detailPart,
          status: statusEl ? statusEl.value : "〇",
          note: noteEl ? noteEl.value : ""
        });

        if (btn) {
          btn.disabled = false;
          btn.textContent = "出欠を送信する";
        }

        if (res && res.result === "success") {
          alert("出欠を送信しました！");
          showHome();
        }
      };
    }

    /**
     * GAS通信用関数
     */
    async function apiCall(payload) {
      const contactAdminMsg = "\n\n問題が解決しない場合は、サイト管理者にお問い合わせください。";

      try {
        const response = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error(`HTTPステータスエラー: ${response.status}`);
        }

        const resData = await response.json();
        if (resData && resData.result === "error") {
          alert("エラー: " + resData.message + contactAdminMsg);
        }
        return resData;
      } catch (err) {
        console.error("API Error Detail:", err);
        alert("通信エラーが発生しました。\n・詳細: " + err.message + contactAdminMsg);
        return null;
      }
    }
  </script>
</body>
</html>
