<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUWO2027 出席登録</title>
  
  <!-- Noto Sans JP の読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 15px;
      background: #f4f6f8;
      color: #333;
    }
    .app-header {
      text-align: center;
      padding: 10px 0 15px;
    }
    .app-header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1a73e8;
      margin: 0;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 15px;
    }
    .hidden {
      display: none !important;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 14px;
    }
    input, select, textarea, button {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: inherit;
    }
    button {
      background: #1a73e8;
      color: white;
      border: none;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
      transition: background 0.2s;
    }
    button:hover {
      background: #1557b0;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #5f6368;
      margin-top: 0;
    }
    .btn-secondary:hover {
      background: #474a4d;
    }
    .concert-item {
      padding: 15px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
      background: #fff;
      transition: background 0.2s, border-color 0.2s;
    }
    .concert-item:hover {
      background: #e8f0fe;
      border-color: #1a73e8;
    }
    .piece-card {
      padding: 12px;
      border: 1px solid #eee;
      border-radius: 6px;
      background: #fafafa;
      margin-bottom: 12px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <!-- アプリヘッダー -->
  <div class="app-header">
    <h1>HUWO2027 出席登録</h1>
  </div>

  <!-- 1. ログイン画面 -->
  <div id="view-login" class="card">
    <h2 style="margin-top:0; font-weight:700; font-size:18px;">団員ログイン</h2>
    <div class="form-group">
      <label for="login-id">ユーザーID</label>
      <input type="text" id="login-id" placeholder="例: u001">
    </div>
    <div class="form-group">
      <label for="login-pass">パスワード</label>
      <input type="password" id="login-pass">
    </div>
    <button id="login-btn" onclick="login()">ログイン</button>
    <p id="login-msg" style="color:red; margin-top: 10px; text-align: center; font-size:14px;"></p>
  </div>

  <!-- 2. ホーム画面 -->
  <div id="view-home" class="hidden">
    <div class="header-bar">
      <h3 style="margin:0; font-weight:700;"><span id="user-name"></span> さん</h3>
      <button onclick="logout()" style="width: auto; padding: 6px 12px;" class="btn-secondary">ログアウト</button>
    </div>

    <!-- 優先度1: 演奏会・乗番設定カード -->
    <div class="card" style="border-left: 5px solid #34a853;">
      <h3 style="margin-top:0; font-weight:700; font-size:16px;">🎼 演奏会・乗番設定</h3>
      <p style="font-size:13px; color:#666;">最初に曲ごとの乗り番や担当パートを登録してください。</p>
      <div id="concert-list">読み込み中...</div>
    </div>

    <!-- 優先度2: 合奏出欠入力カード -->
    <div class="card" style="border-left: 5px solid #1a73e8;">
      <h3 style="margin-top:0; font-weight:700; font-size:16px;">📅 合奏出欠確認</h3>
      <p style="font-size:13px; color:#666;">練習日と対象曲（乗り番）を指定して出欠を入力します。</p>
      <button onclick="showAttendanceForm()">合奏出欠を入力する</button>
    </div>
  </div>

  <!-- 3. 乗番・パート設定画面 -->
  <div id="view-roster" class="card hidden">
    <button onclick="showHome()" class="btn-secondary" style="margin-bottom: 15px; width: auto; padding: 6px 12px;">← ホームへ戻る</button>
    <h3 id="roster-concert-title" style="margin-top:0; font-weight:700; font-size:16px;"></h3>
    <form id="roster-form">
      <div id="pieces-container"></div>
      <button type="submit" id="roster-submit-btn">乗番情報を保存する</button>
    </form>
  </div>

  <!-- 4. 合奏出欠入力画面 -->
  <div id="view-attendance" class="card hidden">
    <button onclick="showHome()" class="btn-secondary" style="margin-bottom: 15px; width: auto; padding: 6px 12px;">← ホームへ戻る</button>
    <h3 style="margin-top:0; font-weight:700; font-size:16px;">📅 合奏出欠入力</h3>
    
    <form id="attendance-form">
      <div class="form-group">
        <label for="att-date">練習日を選択</label>
        <input type="date" id="att-date" onchange="updateTargetPieces()" required>
      </div>

      <!-- 日付＋曲名の選択肢 -->
      <div class="form-group">
        <label for="att-target">対象曲・練習項目</label>
        <select id="att-target" required>
          <option value="">日付を選択してください</option>
        </select>
      </div>

      <!-- 出欠の4択（〇, ✕, 遅刻, 早退） -->
      <div class="form-group">
        <label for="att-status">出欠</label>
        <select id="att-status" required>
          <option value="〇">〇</option>
          <option value="✕">✕</option>
          <option value="遅刻">遅刻</option>
          <option value="早退">早退</option>
        </select>
      </div>

      <div class="form-group">
        <label for="att-note">備考（遅刻早退の時間や理由など）</label>
        <textarea id="att-note" rows="3" placeholder="例: 19:30から遅れて参加予定です"></textarea>
      </div>

      <button type="submit" id="att-submit-btn">出欠を送信する</button>
    </form>
  </div>

  <script>
    // 指定された GAS Web アプリ URL
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzepvTPwUVXo98Faz1MaOtuG5Qv_gLLAeU-iYs1_pZvGeFqgbQjRccfqhZ1Af48vcg/exec";

    const PART_OPTIONS = {
      "Clarinet": ["1st Cl", "2nd Cl", "3rd Cl", "Es Cl", "Alto Cl", "Bass Cl", "ContraBass Cl", "不参加", "その他（直接入力）"],
      "Trumpet": ["1st Tp", "2nd Tp", "3rd Tp", "Flugelhorn", "Cornet", "不参加", "その他（直接入力）"],
      "Saxophone": ["Alto 1st", "Alto 2nd", "Tenor", "Baritone", "Soprano", "不参加", "その他（直接入力）"],
      "Flute": ["1st Fl", "2nd Fl", "Piccolo", "不参加", "その他（直接入力）"],
      "Percussion": ["Timpani", "Snare", "Mallets", "Aux", "不参加", "その他（直接入力）"],
      "Euphonium": ["1st", "2nd", "Solo", "アシスト", "不参加", "その他（直接入力）"],
      "Trombone": ["1st", "2nd", "3rd", "Bass Trb", "不参加", "その他（直接入力）"],
      "Horn": ["1st", "2nd", "3rd", "4th", "不参加", "その他（直接入力）"],
      "Tuba": ["1st", "2nd", "不参加", "その他（直接入力）"]
    };

    let currentUser = null;
    let currentConcerts = [];
    let selectedConcertId = null;

    window.onload = () => {
      const savedUser = localStorage.getItem("band_user");
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        showHome();
      }
    };

    function switchView(viewId) {
      ["view-login", "view-home", "view-roster", "view-attendance"].forEach(id => {
        document.getElementById(id).classList.add("hidden");
      });
      document.getElementById(viewId).classList.remove("hidden");
    }

    async function login() {
      const userId = document.getElementById("login-id").value.trim();
      const password = document.getElementById("login-pass").value.trim();
      const msg = document.getElementById("login-msg");
      const btn = document.getElementById("login-btn");

      if (!userId || !password) {
        msg.textContent = "IDとパスワードを入力してください。";
        return;
      }

      btn.disabled = true;
      msg.textContent = "通信中...";

      const res = await apiCall({ action: "login", userId, password });
      btn.disabled = false;

      if (res && res.result === "success") {
        msg.textContent = "";
        currentUser = res.user;
        localStorage.setItem("band_user", JSON.stringify(currentUser));
        showHome();
      } else {
        msg.textContent = res ? res.message : "ログイン処理に失敗しました。";
      }
    }

    function logout() {
      localStorage.removeItem("band_user");
      currentUser = null;
      document.getElementById("login-id").value = "";
      document.getElementById("login-pass").value = "";
      switchView("view-login");
    }

    async function showHome() {
      switchView("view-home");
      document.getElementById("user-name").textContent = currentUser.name;
      
      const container = document.getElementById("concert-list");
      container.innerHTML = "読み込み中...";

      const res = await apiCall({ action: "getConcerts", userId: currentUser.userId });
      if (res && res.result === "success") {
        currentConcerts = res.concerts;
        container.innerHTML = "";

        if (res.concerts.length === 0) {
          container.innerHTML = "<p style='color:#666;'>予定されている演奏会はありません。</p>";
          return;
        }

        res.concerts.forEach(c => {
          const div = document.createElement("div");
          div.className = "concert-item";
          div.innerHTML = `<strong>${c.title}</strong><br><small style="color:#666;">タップして乗番・パートを設定</small>`;
          div.onclick = () => showRosterForm(c.concertId);
          container.appendChild(div);
        });
      }
    }

    function showRosterForm(concertId) {
      selectedConcertId = concertId;
      const concert = currentConcerts.find(c => c.concertId === concertId);
      document.getElementById("roster-concert-title").textContent = concert.title;
      
      const container = document.getElementById("pieces-container");
      container.innerHTML = "";

      const userPart = currentUser.defaultPart || "";
      const options = PART_OPTIONS[userPart] || ["1st", "2nd", "3rd", "アシスト", "不参加", "その他（直接入力）"];

      concert.pieces.forEach((piece, index) => {
        const savedPart = concert.userRoster[piece] || "";
        const isCustom = savedPart && !options.includes(savedPart);

        const card = document.createElement("div");
        card.className = "piece-card";
        card.innerHTML = `
          <div style="font-weight:bold; margin-bottom:8px;">${piece}</div>
          <div style="display: flex; gap: 8px; flex-direction: column;">
            <select id="select-part-${index}" onchange="toggleCustomInput(${index})">
              <option value="">-- パートを選択 --</option>
              ${options.map(opt => `<option value="${opt}" ${savedPart === opt ? 'selected' : ''}>${opt}</option>`).join('')}
            </select>
            <input type="text" id="custom-part-${index}" placeholder="例: 1st (Es Cl持ち替え)" 
                   value="${isCustom ? savedPart : ''}" 
                   style="display: ${isCustom ? 'block' : 'none'}; margin-top:5px;">
          </div>
        `;
        container.appendChild(card);

        if (isCustom) {
          document.getElementById(`select-part-${index}`).value = "その他（直接入力）";
        }
      });

      switchView("view-roster");
    }

    function toggleCustomInput(index) {
      const select = document.getElementById(`select-part-${index}`);
      const customInput = document.getElementById(`custom-part-${index}`);
      if (select.value === "その他（直接入力）") {
        customInput.style.display = "block";
        customInput.required = true;
      } else {
        customInput.style.display = "none";
        customInput.required = false;
      }
    }

    document.getElementById("roster-form").onsubmit = async (e) => {
      e.preventDefault();
      const concert = currentConcerts.find(c => c.concertId === selectedConcertId);
      const roster = {};

      concert.pieces.forEach((piece, index) => {
        const select = document.getElementById(`select-part-${index}`);
        const customInput = document.getElementById(`custom-part-${index}`);
        
        let finalPart = select.value;
        if (finalPart === "その他（直接入力）") {
          finalPart = customInput.value.trim();
        }

        if (finalPart) {
          roster[piece] = finalPart;
        }
      });

      const btn = document.getElementById("roster-submit-btn");
      btn.disabled = true;
      btn.textContent = "保存中...";

      const res = await apiCall({
        action: "saveRoster",
        userId: currentUser.userId,
        concertId: selectedConcertId,
        roster
      });

      btn.disabled = false;
      btn.textContent = "乗番情報を保存する";

      if (res && res.result === "success") {
        alert("乗番情報を保存しました！");
        showHome();
      }
    };

    function showAttendanceForm() {
      switchView("view-attendance");
      const today = new Date().toISOString().split('T')[0];
      document.getElementById("att-date").value = today;
      updateTargetPieces();
    }

    function updateTargetPieces() {
      const dateVal = document.getElementById("att-date").value;
      const targetSelect = document.getElementById("att-target");
      targetSelect.innerHTML = "";

      if (!dateVal) {
        targetSelect.innerHTML = "<option value=''>日付を選択してください</option>";
        return;
      }

      const d = new Date(dateVal + "T00:00:00");
      const days = ["日", "月", "火", "水", "木", "金", "土"];
      const formattedDateStr = `${d.getMonth() + 1}/${d.getDate()}(${days[d.getDay()]})`;

      let myPieces = [];
      currentConcerts.forEach(c => {
        Object.keys(c.userRoster).forEach(piece => {
          const part = c.userRoster[piece];
          if (part && part !== "不参加") {
            myPieces.push({ concertTitle: c.title, piece, part });
          }
        });
      });

      // 1. 全体合奏
      const defaultOpt = document.createElement("option");
      defaultOpt.value = `${formattedDateStr} 全体合奏`;
      defaultOpt.textContent = `${formattedDateStr} 全体合奏`;
      defaultOpt.setAttribute("data-part", currentUser.defaultPart || "");
      targetSelect.appendChild(defaultOpt);

      // 2. 乗番のある各曲目
      if (myPieces.length > 0) {
        myPieces.forEach(p => {
          const opt = document.createElement("option");
          const valStr = `${formattedDateStr} ${p.piece}`;
          opt.value = valStr;
          opt.textContent = `${valStr} [担当: ${p.part}]`;
          opt.setAttribute("data-part", p.part);
          targetSelect.appendChild(opt);
        });
      }
    }

    document.getElementById("attendance-form").onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById("att-submit-btn");
      btn.disabled = true;
      btn.textContent = "送信中...";

      const targetSelect = document.getElementById("att-target");
      const selectedOption = targetSelect.options[targetSelect.selectedIndex];
      const detailPart = selectedOption ? selectedOption.getAttribute("data-part") || "" : "";

      const res = await apiCall({
        action: "saveAttendance",
        userId: currentUser.userId,
        name: currentUser.name,
        date: document.getElementById("att-date").value,
        targetPiece: targetSelect.value,
        detailPart: detailPart,
        status: document.getElementById("att-status").value,
        note: document.getElementById("att-note").value
      });

      btn.disabled = false;
      btn.textContent = "出欠を送信する";

      if (res && res.result === "success") {
        alert("出欠を送信しました！");
        showHome();
      }
    };

    /**
     * GAS通信用関数（通信エラー回避・詳細エラー取得対応）
     */
    async function apiCall(payload) {
      try {
        const response = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error(`HTTPステータスエラー: ${response.status}`);
        }

        const resData = await response.json();
        if (resData.result === "error") {
          alert("エラー: " + resData.message);
        }
        return resData;
      } catch (err) {
        console.error("API Error Detail:", err);
        alert("通信エラーが発生しました。\n・GASのデプロイ設定（アクセス権: 全員）を確認してください。\n・詳細: " + err.message);
        return null;
      }
    }
  </script>
</body>
</html>
